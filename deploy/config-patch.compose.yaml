name: dclaw-config-patch

services:
  config-patch:
    build:
      context: .
      dockerfile: deploy/config-patch.Dockerfile
    image: ${CONFIG_PATCH_IMAGE:-dclaw-config-patch:local}
    container_name: dclaw-config-patch
    restart: unless-stopped
    environment:
      CONFIG_PATCH_HOST: 0.0.0.0
      CONFIG_PATCH_PORT: "8788"
      CONFIG_PATCH_DATA_DIR: /var/lib/dclaw-config-patch
      CONFIG_PATCH_TOKEN_PEPPER: "${CONFIG_PATCH_TOKEN_PEPPER:?CONFIG_PATCH_TOKEN_PEPPER is required}"
      CONFIG_PATCH_ADMIN_SECRET: "${CONFIG_PATCH_ADMIN_SECRET:?CONFIG_PATCH_ADMIN_SECRET is required}"
      DCLAW_CONFIG_PATCH_INTERNAL_SECRET: "${DCLAW_CONFIG_PATCH_INTERNAL_SECRET:?DCLAW_CONFIG_PATCH_INTERNAL_SECRET is required}"
      OMNICHANNEL_CONFIG_PATCH_INTERNAL_SECRET: "${OMNICHANNEL_CONFIG_PATCH_INTERNAL_SECRET:?OMNICHANNEL_CONFIG_PATCH_INTERNAL_SECRET is required}"
      OMNICHANNEL_CONFIG_PATCH_BASE_URL: "${OMNICHANNEL_CONFIG_PATCH_BASE_URL:?OMNICHANNEL_CONFIG_PATCH_BASE_URL is required}"
    ports:
      - "127.0.0.1:${CONFIG_PATCH_PUBLISH_PORT:-18788}:8788"
    volumes:
      - config-patch-data:/var/lib/dclaw-config-patch
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dclaw-net

networks:
  dclaw-net:
    external: true
    name: dclaw-net

volumes:
  config-patch-data: {}
