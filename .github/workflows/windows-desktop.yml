name: Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out compatible local helper source
        uses: actions/checkout@v4
        with:
          repository: 51taichi/dclaw-server
          ref: 1d2117a565bce578253753ed5a7fdf31296e2f91
          path: dclaw-server
          token: ${{ secrets.DCLAW_SERVER_READ_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri -> target/desktop-cn

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify desktop build profile
        run: node --test scripts/build-desktop.test.mjs

      - name: Build NSIS and MSI installers
        run: npm run desktop:build:cn
        env:
          DCLAW_SERVER_SOURCE_DIR: ${{ github.workspace }}\dclaw-server
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_CN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_CN }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DClaw-Windows-x64-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            console/src-tauri/target/desktop-cn/release/bundle/nsis/*.exe
            console/src-tauri/target/desktop-cn/release/bundle/nsis/*.zip
            console/src-tauri/target/desktop-cn/release/bundle/nsis/*.sig
            console/src-tauri/target/desktop-cn/release/bundle/msi/*.msi
            console/src-tauri/target/desktop-cn/release/bundle/msi/*.zip
            console/src-tauri/target/desktop-cn/release/bundle/msi/*.sig
