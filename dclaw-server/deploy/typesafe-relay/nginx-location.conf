# Loaded by Nginx Proxy Manager inside each proxy host server block.
location = /_dclaw/typesafe/v1/systemone {
  if ($host != "peptide-supermarket.com") {
    return 404;
  }
  if ($scheme != "https") {
    return 404;
  }

  client_max_body_size 2m;
  proxy_connect_timeout 5s;
  proxy_send_timeout 15s;
  proxy_read_timeout 20s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-DClaw-Relay-Token $http_x_dclaw_relay_token;
  proxy_set_header Content-Type $content_type;
  proxy_pass http://dclaw-typesafe-relay:8787/v1/systemone;
}
